name: 刷新岗位数据
on:
  schedule:
    - cron: '15 2 * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch data from Feishu
        run: python3 refresh.py
        env:
          FEISHU_TOKEN: ${{ secrets.FEISHU_TOKEN }}
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add jobs_data.js
          git commit -m "refresh: $(date -u '+%Y-%m-%d %H:%M') UTC" || echo "No changes"
          git push
