<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>秋招投递追踪器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#f0f2f5;color:#333}.header{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;padding:20px 24px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.15)}.header h1{font-size:22px;margin-bottom:4px}.header .sub{font-size:13px;opacity:.85}.header .stats{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.header .stat{background:rgba(255,255,255,.15);padding:4px 12px;border-radius:16px;font-size:13px}.tb{background:#fff;padding:12px 24px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;position:sticky;top:72px;z-index:99;box-shadow:0 1px 4px rgba(0,0,0,.08)}.tb input,.tb select{padding:8px 12px;border:1px solid #d9d9d9;border-radius:6px;font-size:14px;outline:none}.tb input:focus,.tb select:focus{border-color:#667eea}.tb input[type=text]{flex:1;min-width:200px}.tb label{font-size:13px;color:#666;display:flex;align-items:center;gap:4px}.btn{padding:8px 16px;border:none;border-radius:6px;cursor:pointer;font-size:14px}.btn:hover{opacity:.85}.btn-e{background:#52c41a;color:#fff}.btn-i{background:#1890ff;color:#fff}.btn-c{background:#ff4d4f;color:#fff}.tw{padding:16px 24px}table{width:100%;border-collapse:collapse;background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.06)}thead{background:#fafafa}th{padding:12px 8px;text-align:left;font-size:13px;color:#666;border-bottom:1px solid #f0f0f0;white-space:nowrap;cursor:pointer;user-select:none}th:hover{background:#f0f0f0}th .sa{font-size:10px;margin-left:2px}td{padding:10px 8px;font-size:13px;border-bottom:1px solid #f5f5f5;vertical-align:top}tr:hover{background:#fafafa}.co{font-weight:600;color:#333}.po{color:#666;max-width:400px;word-break:break-all;white-space:normal;line-height:1.4}.lb{display:inline-block;padding:4px 10px;background:#1890ff;color:#fff;text-decoration:none;border-radius:4px;font-size:12px;white-space:nowrap}.lb:hover{background:#40a9ff}.lb.d{background:#d9d9d9;cursor:not-allowed}.ss{padding:4px 8px;border:1px solid #d9d9d9;border-radius:4px;font-size:12px;cursor:pointer}.sw{color:#999}.sy{color:#1890ff;font-weight:600}.sb{color:#faad14;font-weight:600}.sm{color:#722ed1;font-weight:600}.so{color:#52c41a;font-weight:600}.sj{color:#ff4d4f;font-weight:600}.sf{color:#8c8c8c;font-weight:600}.di{padding:4px 6px;border:1px solid #d9d9d9;border-radius:4px;font-size:12px;width:100px}.ni{padding:4px 6px;border:1px solid #d9d9d9;border-radius:4px;font-size:12px;width:100px}.ni:focus{border-color:#667eea}.bt{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;background:#e6f7ff;color:#1890ff;margin:1px}.dc{font-size:12px;white-space:nowrap}.ds{color:#1890ff}.dd{color:#ff4d4f}.dd.u{color:#ff4d4f;font-weight:600}.dt{color:#faad14;font-size:11px}.pg{display:flex;justify-content:center;align-items:center;gap:8px;padding:16px;flex-wrap:wrap}.pg button{padding:6px 12px;border:1px solid #d9d9d9;border-radius:4px;background:#fff;cursor:pointer;font-size:13px}.pg button:hover{border-color:#667eea;color:#667eea}.pg button.a{background:#667eea;color:#fff;border-color:#667eea}.pg button:disabled{cursor:not-allowed;opacity:.5}.nd{text-align:center;padding:40px;color:#999;font-size:14px}.md{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:200;justify-content:center;align-items:center}.md.s{display:flex}.mc{background:#fff;border-radius:8px;padding:24px;max-width:500px;width:90%}.mc h3{margin-bottom:16px}.mc .mb{display:flex;gap:8px;margin-top:12px;justify-content:flex-end}.fc{font-size:13px;color:#999;margin-left:auto}.ld{text-align:center;padding:60px;color:#999;font-size:16px}
</style>
</head>
<body>
<div class="header"><h1>秋招投递追踪器</h1><div class="sub">数据来源：飞书多维表格 | 12395 条岗位 | 更新至 2026-09-19 | 追踪数据保存在本地浏览器</div><div class="stats" id="stats"></div></div>
<div class="tb">
<input type="text" id="search" placeholder="搜索公司/岗位/地点..." />
<label>企业类型 <select id="ft"><option value="">全部</option></select></label>
<label>地点 <input type="text" id="fl" placeholder="如:北京" style="padding:8px 12px;border:1px solid #d9d9d9;border-radius:6px;font-size:14px;outline:none;width:100px" /></label>
<label>批次 <select id="fb"><option value="">全部</option></select></label>
<label>状态 <select id="fs"><option value="">全部</option><option value="未投递">未投递</option><option value="已投递">已投递</option><option value="笔试中">笔试中</option><option value="面试中">面试中</option><option value="已Offer">已Offer</option><option value="已拒绝">已拒绝</option><option value="已放弃">已放弃</option></select></label>
<label>发布日期 <input type="date" id="fd" style="padding:8px 12px;border:1px solid #d9d9d9;border-radius:6px;font-size:14px;outline:none" /></label>
<label>仅看有链接 <input type="checkbox" id="fh" /></label>
<button class="btn btn-e" onclick="exportData()">导出</button>
<button class="btn btn-i" onclick="document.getElementById('if').click()">导入</button>
<button class="btn btn-c" onclick="clearData()">清空追踪</button>
<input type="file" id="if" style="display:none" accept=".json" onchange="importData(event)" />
<span class="fc" id="fc"></span>
</div>
<div class="tw"><div class="ld" id="ld">正在加载岗位数据...</div>
<table id="jt" style="display:none"><thead><tr>
<th data-s="1">公司 <span class="sa"></span></th><th data-s="2">招聘岗位 <span class="sa"></span></th><th data-s="4">地点 <span class="sa"></span></th><th data-s="5">批次 <span class="sa"></span></th><th data-s="6">发布日期 <span class="sa"></span></th><th data-s="7">截止日期 <span class="sa"></span></th><th data-s="3">投递链接</th><th data-s="0">投递状态 <span class="sa"></span></th><th>投递日期</th><th>备注</th>
</tr></thead><tbody id="tb2"></tbody></table>
<div class="pg" id="pg"></div></div>
<div class="md" id="cm"><div class="mc"><h3 id="mt">确认</h3><p id="mm" style="margin-bottom:16px;color:#666"></p><div class="mb"><button class="btn" style="background:#f0f0f0" onclick="document.getElementById('cm').classList.remove('s')">取消</button><button class="btn" id="mco" style="background:#ff4d4f;color:#fff">确认</button></div></div></div>
<script src="jobs_data.js"></script>
<script>
var JOBS=JD.map(function(d){return{id:d[0],company:d[1],position:d[2],link:d[3],location:d[4],batch:d[5],start_date:d[6],deadline:d[7],company_type:d[8]||''}});
var SK='jt_v1',PS=50,cp=1,sf=6,sa=0,tr={},SC={'未投递':'sw','已投递':'sy','笔试中':'sb','面试中':'sm','已Offer':'so','已拒绝':'sj','已放弃':'sf'},td=new Date().toISOString().slice(0,10);
function lt(){try{tr=JSON.parse(localStorage.getItem(SK)||'{}')}catch(e){tr={}}}
function st(){localStorage.setItem(SK,JSON.stringify(tr))}
function gt(id){if(!tr[id])tr[id]={s:'未投递',d:'',n:''};return tr[id]}
function us(){var s={'未投递':0,'已投递':0,'笔试中':0,'面试中':0,'已Offer':0,'已拒绝':0,'已放弃':0},tk=0;JOBS.forEach(function(j){var t=gt(j.id);if(t.s&&t.s!=='未投递'){tk++;s[t.s]=(s[t.s]||0)+1}else{s['未投递']++}});document.getElementById('stats').innerHTML='<span class="stat">总岗位 '+JOBS.length+'</span><span class="stat">已追踪 '+tk+'</span>'+Object.entries(s).filter(function(e){return e[1]>0&&e[0]!=='未投递'}).map(function(e){return'<span class="stat">'+e[0]+' '+e[1]+'</span>'}).join('')}
function pb(){var b=new Set();JOBS.forEach(function(j){if(j.batch){var a=j.batch.split(',');a.forEach(function(x){x&&b.add(x)})}});var s=document.getElementById('fb');Array.from(b).sort().forEach(function(b){var o=document.createElement('option');o.value=b;o.textContent=b;s.appendChild(o)})}
function pt(){var t=new Set();JOBS.forEach(function(j){if(j.company_type){var a=j.company_type.split(',');a.forEach(function(x){x&&t.add(x)})}});var s=document.getElementById('ft');Array.from(t).sort().forEach(function(b){var o=document.createElement('option');o.value=b;o.textContent=b;s.appendChild(o)})}
function idd(s){return s&&/^\d{4}-\d{2}-\d{2}/.test(s)}
function fdl(d){if(!d)return'<span style="color:#ccc">-</span>';if(idd(d)){var p=d.substring(0,10)<td;return'<span class="dd'+(p?' u':'')+'">'+d.substring(0,10)+(p?' ⚠':'')+'</span>'}return'<span class="dt">'+eh(d)+'</span>'}
function gf(){var q=document.getElementById('search').value.toLowerCase().trim(),b=document.getElementById('fb').value,st2=document.getElementById('fs').value,hl=document.getElementById('fh').checked,fd=document.getElementById('fd').value,ft=document.getElementById('ft').value,fl=document.getElementById('fl').value.toLowerCase().trim();var f=JOBS.filter(function(j){if(q){var t=(j.company+' '+j.position+' '+j.location).toLowerCase();if(t.indexOf(q)<0)return false}if(b){var a=j.batch.split(',');if(a.indexOf(b)<0)return false}if(st2){if(gt(j.id).s!==st2)return false}if(hl&&!j.link)return false;if(fd&&j.start_date!==fd)return false;if(ft&&j.company_type!==ft)return false;if(fl&&(j.location||'').toLowerCase().indexOf(fl)<0)return false;return true});f.sort(function(a,b){var va,vb;if(sf===0){va=gt(a.id).s;vb=gt(b.id).s}else if(sf===3){va=a.link?'1':'0';vb=b.link?'1':'0'}else if(sf===7){va=idd(a.deadline)?a.deadline:'9999';vb=idd(b.deadline)?b.deadline:'9999'}else{va=(a[['','company','position','link','location','batch','start_date','deadline'][sf]]||'').toString();vb=(b[['','company','position','link','location','batch','start_date','deadline'][sf]]||'').toString()}var c=va.localeCompare(vb,'zh');return sa?c:-c});return f}
function eh(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function ea(s){return(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function rn(){var f=gf(),tp=Math.ceil(f.length/PS)||1;if(cp>tp)cp=tp;var st3=(cp-1)*PS,pj=f.slice(st3,st3+PS),tb=document.getElementById('tb2');if(pj.length===0){tb.innerHTML='<tr><td colspan="10" class="nd">没有符合条件的岗位</td></tr>'}else{tb.innerHTML=pj.map(function(j){var t=gt(j.id),ba=j.batch.split(',').filter(Boolean).map(function(b){return'<span class="bt">'+eh(b)+'</span>'}).join(''),lh=j.link?'<a href="'+ea(j.link)+'" target="_blank" class="lb">去投递</a>':'<span class="lb d">无链接</span>',ps=j.position,sc=SC[t.s]||'sw',sh=j.start_date?'<span class="dc ds">'+eh(j.start_date)+'</span>':'<span style="color:#ccc">-</span>',dh=fdl(j.deadline);return'<tr><td class="co">'+eh(j.company)+'</td><td class="po" title="'+ea(j.position)+'">'+eh(ps)+'</td><td>'+eh(j.location||'')+'</td><td>'+ba+'</td><td>'+sh+'</td><td>'+dh+'</td><td>'+lh+'</td><td><select class="ss '+sc+'" onchange="ss2(\''+j.id+'\',this.value)"><option value="未投递"'+(t.s==='未投递'?' selected':'')+'>未投递</option><option value="已投递"'+(t.s==='已投递'?' selected':'')+'>已投递</option><option value="笔试中"'+(t.s==='笔试中'?' selected':'')+'>笔试中</option><option value="面试中"'+(t.s==='面试中'?' selected':'')+'>面试中</option><option value="已Offer"'+(t.s==='已Offer'?' selected':'')+'>已Offer</option><option value="已拒绝"'+(t.s==='已拒绝'?' selected':'')+'>已拒绝</option><option value="已放弃"'+(t.s==='已放弃'?' selected':'')+'>已放弃</option></select></td><td><input type="date" class="di" value="'+ea(t.d||'')+'" onchange="sd(\''+j.id+'\',this.value)"></td><td><input type="text" class="ni" placeholder="备注..." value="'+ea(t.n||'')+'" onchange="sn(\''+j.id+'\',this.value)"></td></tr>'}).join('')}var pg=document.getElementById('pg'),h='<button '+(cp<=1?'disabled':'')+' onclick="gp('+(cp-1)+')">上一页</button>',mb=10,s2=Math.max(1,cp-5),e=Math.min(tp,s2+mb-1);if(e-s2<mb-1)s2=Math.max(1,e-mb+1);if(s2>1)h+='<button onclick="gp(1)">1</button>'+(s2>2?'<span>...</span>':'');for(var i=s2;i<=e;i++)h+='<button class="'+(i===cp?'a':'')+'" onclick="gp('+i+')">'+i+'</button>';if(e<tp)h+=(e<tp-1?'<span>...</span>':'')+'<button onclick="gp('+tp+')">'+tp+'</button>';h+='<button '+(cp>=tp?'disabled':'')+' onclick="gp('+(cp+1)+')">下一页</button><span style="margin-left:8px;font-size:13px;color:#999">共 '+f.length+' 条</span>';pg.innerHTML=h;document.getElementById('fc').textContent='筛选: '+f.length+'/'+JOBS.length;document.querySelectorAll('th[data-s]').forEach(function(th){var a=th.querySelector('.sa');if(parseInt(th.dataset.s)===sf)a.textContent=sa?'▲':'▼';else a.textContent=''});us()}
function gp(p){cp=p;rn();window.scrollTo(0,0)}
function ss2(id,v){gt(id).s=v;if(v!=='未投递'&&!gt(id).d)gt(id).d=td;st();rn()}
function sd(id,v){gt(id).d=v;st();rn()}
function sn(id,v){gt(id).n=v;st()}
function exportData(){var d=JSON.stringify(tr,null,2),b=new Blob([d],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='job_tracker_'+td+'.json';a.click()}
function importData(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(e){try{var i=JSON.parse(e.target.result);Object.assign(tr,i);st();rn();alert('导入成功！')}catch(err){alert('导入失败')}};r.readAsText(f);e.target.value=''}
function clearData(){document.getElementById('mt').textContent='清空追踪数据';document.getElementById('mm').textContent='确定要清空所有投递追踪记录吗？此操作不可撤销。';document.getElementById('cm').classList.add('s');document.getElementById('mco').onclick=function(){tr={};st();rn();document.getElementById('cm').classList.remove('s')}}
document.getElementById('search').addEventListener('input',function(){cp=1;rn()});
document.getElementById('fb').addEventListener('change',function(){cp=1;rn()});
document.getElementById('fs').addEventListener('change',function(){cp=1;rn()});
document.getElementById('fh').addEventListener('change',function(){cp=1;rn()});
document.getElementById('fd').addEventListener('change',function(){cp=1;rn()});
document.getElementById('ft').addEventListener('change',function(){cp=1;rn()});
document.getElementById('fl').addEventListener('input',function(){cp=1;rn()});
document.querySelectorAll('th[data-s]').forEach(function(th){th.addEventListener('click',function(){var f=parseInt(th.dataset.s);if(sf===f)sa=!sa;else{sf=f;sa=0}rn()})});
lt();pb();pt();document.getElementById('ld').style.display='none';document.getElementById('jt').style.display='';rn();
</script>
</body>
</html>
